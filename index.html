<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Web Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🌟 MURUGAN Web Store 🌟</h1>
  <div class="products">
    <div class="product">
      <img src="im1.jpg" alt="Product 1">

      <button onclick="addToCart('Product 1', 100)">Add to Cart</button>
    </div>

    </div>
    <div class="product">
      <img src="im4.jpg" alt="Product 4">
      <h2>Product 4</h2>
      <p>$120</p>
      <button onclick="addToCart('Product 4', 120)">Add to Cart</button>
    </div>
    <div class="product">

      <h2>Product 5</h2>

      <button onclick="addToCart('Product 7', 130)">Add to Cart</button>

    </div>
    <div class="product">
      <img src="im9.jpg" alt="Product 9">
      <h2>Product 9</h2>
      <p>$250</p>
      <button onclick="addToCart('Product 9', 250)">Add to Cart</button>
    </div>
  </div>

 
  <div id="cart">
    <h2>🛒 Cart</h2>
    <ul id="cart-items"></ul>
    <button onclick="orderNow()">Order Now</button>
    <button onclick="clearCart()">Clear Cart</button>
  </div>
  

  <script src="script.js"></script>
</body>
</html>
