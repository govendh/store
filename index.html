<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Web Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🌟 eniGO Web Store 🌟</h1>
  <div class="products">
    <div class="product">
      <img src="im1.jpg" alt="Product 1">
      <h2>Lap Top</h2>
      <p>Rs.20,000</p>
      <button onclick="addToCart('laptop', 2000)">Add to Cart</button>
    </div>
    <div class="product">
      <img src="im2.jpg" alt="Product 2">
      <h2>Mobile </h2>
      <p>Rs.10,000</p>
      <button onclick="addToCart('phone', 10000)">Add to Cart</button>
    </div>
    <div class="product">
      <img src="im3.jpg" alt="Product 3">
      <h2>Watch</h2>
      <p>Rs.150</p>
      <button onclick="addToCart('watch', 150)">Add to Cart</button>
    </div>
    <div class="product">
      <img src="im4.jpg" alt="Product 4">
      <h2>Pink Teddy </h2>
      <p>Rs.100</p>
      <button onclick="addToCart('teddy', 100)">Add to Cart</button>
    </div>
    <div class="product">
      <img src="im5.jpg" alt="Product 5">
      <h2>chocolate</h2>
      <p>Rs.45</p>
      <button onclick="addToCart('snacks', 45)">Add to Cart</button>
    </div>
    <div class="product">
      <img src="im6.jpg" alt="Product 6">
      <h2>note set</h2>
      <p>Rs.210</p>
      <button onclick="addToCart('note', 210)">Add to Cart</button>
    </div>
    <div class="product">
      <img src="im7.jpg" alt="Product 7">
      <h2>Remote Bike</h2>
      <p>Rs.200</p>
      <button onclick="addToCart('rc bike', 200)">Add to Cart</button>
    </div>
    <div class="product">
      <img src="im8.jpg" alt="Product 8">
      <h2>Remote car</h2>
      <p>Rs.250 </p>
      <button onclick="addToCart('rc car', 250)">Add to Cart</button>
    </div>
    <div class="product">
      <img src="im9.jpg" alt="Product 9">
      <h2>Makeupset</h2>
      <p>Rs.30,0000</p>
      <button onclick="addToCart('makeupset', 30000)">Add to Cart</button>
    </div>
  </div>

 
  <div id="cart">
    <h2>🛒 Cart</h2>
    <ul id="cart-items"></ul>
    <button onclick="orderNow()">Order Now</button>
    <button onclick="clearCart()">Clear Cart</button>
  </div>
  

  <script src="script.js"></script>
</body>
</html>
